[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ualf"
version = "1.3.0"
description = "Unified Agent Log Format (UALF) reference SDK, schemas, and verifier"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "cryptography>=45,<47",
    "jsonschema>=4.25,<5",
    "rfc8785>=0.1.4,<0.2",
]

[project.optional-dependencies]
analytics = [
    "pyarrow>=23,<24",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["sdk/python"]
